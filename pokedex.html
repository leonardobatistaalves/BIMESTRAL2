<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="estilos.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon/pokebola.icon.webp">
    <title>Trabalho Bimestral</title>
</head>
<body>
    <div id="caixaCentral">
        <h1 id="tituloPrincipal">POKEQUIZ</h1>
        <h2>Encontre seu pokemon favorito por aqui!!</h2>
        
        <form class="busca">
            <input 
            type="search" 
            id="atalhoDeBusca"
            placeholder="Coutodex te ajuda"
            aria-label="Nome do pokemon"
            required>
            <button type="submit" id="botaoDeBusca">Buscar</button>
        </form>
    </div>
    <script src="javaScript.js"></script>
</body>
</html>
