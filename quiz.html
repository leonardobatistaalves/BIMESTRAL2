<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="quiz.css">
    <link rel="icon" href="favicon/pokebola.icon.webp">
    <title>PokeQuiz</title>
</head>
<body>
    <header>
        <h1 id="titulo-quiz">PokeQuiz</h1>
        <h2 id="jogador"></h2>
    </header>

    <main id="caixa-quiz">
        <div id="tela-quiz">
            <p id="numero-questao"></p>
            <img id="imagem-pokemon" alt="Pokémon">
            <div id="alternativas"></div>
        </div>

        <div id="tela-fim" hidden>
            <p id="resultado"></p>
            <h3>Ranking</h3>
            <ol id="ranking"></ol>
            <button id="jogar-novamente">JOGAR NOVAMENTE</button>
        </div>
    </main>

    <footer>
        <p>Projeto feito por alunos CEFET-MG</p>
    </footer>

    <script src="quiz.js"></script>
</body>
</html>
