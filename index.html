<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="estilos.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Bimestral</title>
</head>
<body>
    <h1 id="tituloPrincipal">Encontre seu pokemon na coutodex</h1>

    <form class="busca">
    <input 
    type="search" 
    id="atalhoDeBusca"
    placeholder="Coutodex te ajuda"
    aria-label="Nome do pokemon"
    required>

    <button type="submit" id="botaoDeBusca">Buscar</button>

    </form>

    
</body>
</html>
